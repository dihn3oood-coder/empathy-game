<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Quiz Game</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .quiz-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #eef0f3;
    }

    .score-badge {
      background-color: #e3f2fd;
      color: #0d47a1;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
    }

    .question-count {
      color: #666;
      font-size: 0.95rem;
    }

    .question-text {
      font-size: 1.2rem;
      color: #1a1a1a;
      margin-bottom: 25px;
      min-height: 50px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background-color: #ffffff;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 1rem;
      color: #333;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover {
      border-color: #2196f3;
      background-color: #e3f2fd;
    }

    .hidden {
      display: none !important;
    }

    .restart-btn {
      background-color: #2196f3;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }

    .restart-btn:hover {
      background-color: #1976d2;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- Active Quiz View -->
    <div id="quiz-view">
      <div class="header-bar">
        <span class="question-count" id="question-tracker">Question 1</span>
        <span class="score-badge">Points: <span id="score-display">0</span></span>
      </div>

      <div class="question-text" id="question-text">Loading question...</div>

      <div class="options-grid" id="options-container">
        <!-- Buttons injected dynamically -->
      </div>
    </div>

    <!-- Final Results View -->
    <div id="results-view" class="hidden">
      <h2>🎉 Quiz Complete!</h2>
      <p>Your total score is: <strong id="final-score">0</strong> points</p>
      <button class="restart-btn" onclick="resetQuiz()">Play Again</button>
    </div>
  </div>

  <script>
    // 1. DATA ARRAY: REPLACE THIS ARRAY WITH YOUR OWN QUESTIONS
    const quizData = [
      {
        question: "Which human quality allows us to feel empathy towards others?",
        options: ["Algorithms", "Emotions & Heart", "Data Processing", "Sensors"],
        correctIndex: 1
      },
      {
        question: "How does an AI model learn to recognize pictures?",
        options: ["By sleeping", "By training on thousands of data examples", "By guessing randomly", "It is born knowing everything"],
        correctIndex: 1
      },
      {
        question: "Which tool is used as an input device for digital drawing on tablets?",
        options: ["Stylus Pen", "Thermal Printer", "Speaker", "Projector"],
        correctIndex: 0
      }
    ];

    // 2. STATE TRACKERS
    let currentQuestionIndex = 0;
    let totalScore = 0;

    // 3. DOM ELEMENTS
    const questionTracker = document.getElementById("question-tracker");
    const scoreDisplay = document.getElementById("score-display");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const quizView = document.getElementById("quiz-view");
    const resultsView = document.getElementById("results-view");
    const finalScore = document.getElementById("final-score");

    // 4. RENDER QUESTION FUNCTION
    function renderQuestion() {
      // Clear previous options to prevent frozen click handlers
      optionsContainer.innerHTML = "";

      const currentData = quizData[currentQuestionIndex];

      questionText.innerText = currentData.question;
      questionTracker.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;

      // Create dynamic option buttons
      currentData.options.forEach((optionText, optionIndex) => {
        const button = document.createElement("button");
        button.classList.add("option-btn");
        button.innerText = optionText;

        // Bind answer selection handler
        button.onclick = () => selectOption(optionIndex);

        optionsContainer.appendChild(button);
      });
    }

    // 5. SELECTION LOGIC (Fixed transition bug)
    function selectOption(selectedIndex) {
      const currentData = quizData[currentQuestionIndex];

      // Update score if correct
      if (selectedIndex === currentData.correctIndex) {
        totalScore += 10;
        scoreDisplay.innerText = totalScore;
      }

      // Increment index
      currentQuestionIndex++;

      // Force view update or load completion screen
      if (currentQuestionIndex < quizData.length) {
        renderQuestion();
      } else {
        showCompletionScreen();
      }
    }

    // 6. SHOW RESULTS
    function showCompletionScreen() {
      quizView.classList.add("hidden");
      resultsView.classList.remove("hidden");
      finalScore.innerText = totalScore;
    }

    // 7. RESTART QUIZ
    function resetQuiz() {
      currentQuestionIndex = 0;
      totalScore = 0;
      scoreDisplay.innerText = totalScore;
      resultsView.classList.add("hidden");
      quizView.classList.remove("hidden");
      renderQuestion();
    }

    // INITIALIZE ON LOAD
    renderQuestion();
  </script>
</body>
</html>
